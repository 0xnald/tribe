[package]
name = "tribe_arena"
version = "0.1.0"
description = "Tribe Arena program: competitive ownership layer for markets on Solana"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "lib"]
name = "tribe_arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
pyth-solana-receiver-sdk = "2.0.0"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
